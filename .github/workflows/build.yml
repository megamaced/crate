name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Read-only by default. Only the release job is granted contents: write, so the
# jobs that run composer/npm install scripts never hold a token that can push.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # PHPUnit 13 and its sebastian/* dependencies require 8.4, so the dev
      # toolchain only installs there. composer.json's own floor is ^8.2 and is
      # covered by the php-floor job.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          # gd: the artwork/photo pipeline decodes and re-encodes through it,
          # and the metadata-stripping tests assert on the bytes that come out.
          # Without it those skip rather than fail, which is worse than either.
          extensions: gd
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/phpcs --standard=PSR12 lib/ tests/

      # Level 5 with no baseline. doctrine/dbal is a dev dependency pinned to
      # the major Nextcloud ships (^3.10), so migration signatures are analysed
      # against the DBAL the app actually runs on.
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - run: vendor/bin/phpunit --testsuite unit

  php-floor:
    # composer.json declares php ^8.2 and info.xml allows Nextcloud versions
    # that ship 8.2/8.3, but the dev toolchain cannot install there. Parsing
    # every file is what can be checked on the floor — it catches syntax an
    # older PHP rejects, not incompatible runtime API use.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: find lib tests -name '*.php' -print0 | xargs -0 -n1 php -l

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # @nextcloud/webpack-vue-config hardcodes `publicPath` to `/apps/<app>/js/`,
      # so webpack builds lazy-chunk URLs from a prefix that only exists when the
      # app lives under the `apps` root. The official Nextcloud Docker image
      # installs apps into `custom_apps`, served at `/custom_apps`, where every
      # dynamically imported component 404s — the symptom that shipped in v1.9.0.
      # webpack.config.js overrides the prefix to `auto`; nothing in the build
      # itself fails when that override is lost, so assert it here instead.
      - name: Assert the bundle has no hardcoded apps root
        run: |
          if [ ! -d js ]; then
            echo "::error file=webpack.config.js::js/ is missing after 'npm run build', so the publicPath check could not run."
            exit 1
          fi
          mapfile -t bundles < <(find js -type f -name '*.js' | sort)
          if [ "${#bundles[@]}" -eq 0 ]; then
            echo "::error file=webpack.config.js::'npm run build' emitted no *.js under js/, so the publicPath check could not run."
            exit 1
          fi
          echo "Scanning ${#bundles[@]} built file(s) for a hardcoded apps root."
          if hits=$(grep -Fl 'apps/crate/js' "${bundles[@]}"); then
            echo "Hardcoded 'apps/crate/js' found in:"
            echo "$hits"
            echo "::error file=webpack.config.js::The built bundle hardcodes 'apps/crate/js' as its publicPath, so every lazily imported component (settings panel, all modals) will 404 on installs whose apps root is not 'apps' — the official Docker image serves apps from '/custom_apps'. Restore output.publicPath = 'auto' in webpack.config.js."
            exit 1
          fi
          echo "OK: publicPath is resolved at runtime, no apps root baked into the bundle."

      - name: Upload built JS bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crate-js-${{ github.sha }}
          path: js/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [php, php-floor, js]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Package the exact bundle the js job linted and built, rather than a
      # second independent webpack run over the same inputs.
      - name: Download built JS bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: crate-js-${{ github.sha }}
          path: js/

      - name: Build release archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/crate"
          cp -r appinfo img lib templates js LICENSE README.md "$STAGE/crate/"
          tar -C "$STAGE" -czf "crate-${VERSION}.tar.gz" crate

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: crate-*.tar.gz
          generate_release_notes: true
