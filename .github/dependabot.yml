version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # New releases wait a week before Dependabot proposes them: minor and patch
    # PRs merge themselves once CI is green, so this is the window for a
    # hijacked release to be caught and yanked upstream first. Security
    # updates skip the wait.
    cooldown:
      default-days: 7
    groups:
      nextcloud:
        patterns: ['@nextcloud/*']

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Also keeps the commit-SHA pins in .github/workflows up to date, which is
  # what makes pinning to a SHA maintainable rather than a one-off.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
